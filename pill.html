<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
<title>Promptly</title>
<style>
/* The floating pill shown while you talk from another app. Same tokens as the main window. */
:root {
  color-scheme: light;
  --ink: 28, 28, 32;
  --pill: rgba(250, 250, 252, 0.94);
  --edge: rgba(0, 0, 0, 0.10);
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
  --rec: #E5352B;
  --ok: #177A45;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --ink: 236, 236, 240;
    --pill: rgba(36, 36, 40, 0.94);
    --edge: rgba(255, 255, 255, 0.10);
    --shadow: 0 10px 32px rgba(0, 0, 0, 0.5);
    --rec: #FF453A;
    --ok: #4CC47E;
  }
}
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body {
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-font-smoothing: antialiased;
  user-select: none;
}
.pill {
  display: flex; align-items: center; gap: 10px;
  height: 44px; max-width: 440px; padding: 0 18px 0 16px; box-sizing: border-box;
  border-radius: 22px; background: var(--pill); border: 0.5px solid var(--edge); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  color: rgb(var(--ink)); font-size: 13px;
  opacity: 0; transform: translateY(8px); transition: opacity 160ms ease, transform 160ms ease;
}
.pill.visible { opacity: 1; transform: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); flex-shrink: 0; animation: pulse 1.2s ease-in-out infinite; }
.paused .dot { animation: none; opacity: 0.45; }
@keyframes pulse { 50% { opacity: 0.35; } }
.wave { display: flex; align-items: center; gap: 2px; height: 22px; }
.wave i { display: block; width: 3px; height: 3px; border-radius: 2px; background: rgba(var(--ink), 0.75); }
.meta { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.meta b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta span { color: rgba(var(--ink), 0.72); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid rgba(var(--ink), 0.2); border-top-color: rgb(var(--ink)); animation: spin 0.8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.stream { max-width: 340px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; color: rgba(var(--ink), 0.8); }
.stream bdi { direction: ltr; unicode-bidi: plaintext; }
.check { color: var(--ok); font-weight: 700; }
.action {
  margin-left: 6px; height: 28px; padding: 0 12px; border-radius: 14px; border: 0.5px solid var(--edge);
  background: rgba(var(--ink), 0.08); color: rgb(var(--ink)); font: inherit; font-weight: 600; cursor: pointer;
}
.action:hover { background: rgba(var(--ink), 0.14); }
.action:focus-visible { outline: 2px solid rgba(10, 132, 255, 0.7); outline-offset: 2px; }
#recording, #thinking, .row { display: flex; align-items: center; gap: 10px; min-width: 0; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .dot, .spin { animation: none; } .pill { transition: none; } }
</style>
</head>
<body>
<div class="pill" id="pill" role="status" aria-live="polite">
  <div id="recording">
    <div class="row">
      <span class="dot" aria-hidden="true"></span>
      <div class="wave" id="wave" aria-hidden="true"></div>
      <div class="meta"><b id="rec-title">Listening</b><span id="rec-detail"></span></div>
    </div>
  </div>
  <div id="thinking" hidden>
    <div class="row">
      <span class="spin" aria-hidden="true"></span>
      <!-- A live ticker of the newest words: showing only the tail is the point, so the layout
           audit leaves it out. -->
      <div class="stream" id="stream" data-audit-skip><bdi id="stream-text">Writing your prompt…</bdi></div>
    </div>
  </div>
  <div id="copied" hidden><span class="check">✓</span> Prompt copied</div>
  <div id="dictated" hidden>
    <div class="row">
      <span><span class="check">✓</span> <span id="dictated-text">Typed</span></span>
      <button class="action" id="make-prompt" type="button">Make it a prompt</button>
    </div>
  </div>
</div>
<script>
const BARS = 14;
const wave = document.getElementById('wave');
const bars = Array.from({ length: BARS }, () => wave.appendChild(document.createElement('i')));
const history = new Array(BARS).fill(0);
const pill = document.getElementById('pill');
const panels = ['recording', 'thinking', 'copied', 'dictated'];

function show(panel) {
  panels.forEach((p) => { document.getElementById(p).hidden = p !== panel; });
  pill.classList.toggle('visible', !!panel);
}

function describe(state) {
  const parts = [];
  if (state.context && state.context.appName) parts.push('for ' + state.context.appName);
  if (state.context && state.context.selectedText) parts.push('using your selection');
  return [state.mode, ...parts].filter(Boolean).join(' · ');
}

window.electronAPI.onPillState((state) => {
  if (state.state === 'hidden') { show(null); return; }
  if (state.state === 'recording') {
    pill.classList.toggle('paused', !!state.paused);
    document.getElementById('rec-title').textContent = state.paused ? 'Paused' : 'Listening';
    document.getElementById('rec-detail').textContent = describe(state);
    show('recording');
  } else if (state.state === 'thinking') {
    const waiting = state.mode === 'Dictation' ? 'Transcribing…' : 'Writing your prompt…';
    document.getElementById('stream-text').textContent = (state.text || '').replace(/\s+/g, ' ').trim() || waiting;
    show('thinking');
  } else if (state.state === 'copied') {
    show('copied');
  } else if (state.state === 'dictated') {
    // Typed where the cursor was, or (without Accessibility) left on the clipboard.
    document.getElementById('dictated-text').textContent = state.typed ? 'Typed' : 'Copied, press ⌘V';
    show('dictated');
  }
});

document.getElementById('make-prompt').addEventListener('click', () => window.electronAPI.pillAction('make-prompt'));

// The waveform runs on its own 60 fps clock and eases toward the latest mic level, so uneven
// arrival of levels (they come from another window, through the main process) never shows as
// stutter. It scrolls one bar every 70 ms.
let targetLevel = 0;
let shownLevel = 0;
let lastShift = 0;
let animating = false;
window.electronAPI.onAudioLevel((level) => {
  targetLevel = Math.max(0, Math.min(1, level));
  if (!animating) { animating = true; requestAnimationFrame(tick); }
});
function tick(now) {
  if (document.getElementById('recording').hidden) { animating = false; return; }
  // Rise quickly, fall gently: speech looks lively without flicker.
  shownLevel += (targetLevel - shownLevel) * (targetLevel > shownLevel ? 0.45 : 0.12);
  if (now - lastShift >= 70) {
    history.shift();
    history.push(shownLevel);
    lastShift = now;
  }
  // The newest bar follows the live level between shifts, so the right edge moves every frame.
  history[BARS - 1] = Math.max(history[BARS - 1] * 0.9, shownLevel);
  bars.forEach((bar, i) => { bar.style.height = (3 + history[i] * 19).toFixed(1) + 'px'; });
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
