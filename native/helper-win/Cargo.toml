[package]
name = "promptly-helper"
version = "1.0.0"
edition = "2021"
description = "Promptly's Windows helper: hold-to-talk hotkey watching over JSON lines (see main/helper.js)"
publish = false

[[bin]]
name = "promptly-helper"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
# A panic inside the keyboard hook can't unwind into Windows; exiting lets main/helper.js restart us.
panic = "abort"
strip = true
