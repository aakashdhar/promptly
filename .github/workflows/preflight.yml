name: Preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build renderer
        run: npm run build:renderer
      - name: Run splash screen assertions
        run: node scripts/assert-splash.js
      # CHECKs 7-10: the codebase assertions (the others need a signed-in Claude and local tools).
      - name: Preflight codebase checks
        run: bash scripts/preflight.sh --codebase-only

  e2e:
    # The real app, driven by Playwright with the fake Claude and Whisper (no network, no sign-in).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Keep the screenshots and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
