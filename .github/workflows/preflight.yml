name: Preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build renderer
        run: npm run build:renderer
      - name: Run splash screen assertions
        run: node scripts/assert-splash.js
      # CHECKs 7-10: the codebase assertions (the others need a signed-in Claude and local tools).
      - name: Preflight codebase checks
        run: bash scripts/preflight.sh --codebase-only

